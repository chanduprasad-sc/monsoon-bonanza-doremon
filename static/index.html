<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Jump, collect eligible baskets, and climb the Doremon Jump Runs reward track." />
    <link rel="icon" href="/favicon.svg" />
    <title>Doremon Jump</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify scans static HTML for form definitions. The visible React form posts to this form name. -->
    <form name="doremon-jump-leads" data-netlify="true" hidden>
      <input name="name" />
      <input name="mobile" />
      <input name="branch" />
      <input name="campaign" />
      <input name="score" />
      <input name="runs" />
      <input name="rewardPoints" />
      <input name="goodiesCollected" />
      <input name="villainsDefeated" />
      <input name="worldReached" />
      <input name="basketBreakdown" />
      <input name="completedAt" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
